<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" fill="none">
  <defs>
    <linearGradient id="kaiFullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="bladeGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#70a6c7"/>
    </linearGradient>
    <filter id="jadeGlowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00ff88" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Emblem Group (Left) -->
  <g transform="translate(4, 3) scale(0.78)">
    <!-- Combat Octagon -->
    <polygon points="18,2 46,2 62,18 62,46 46,62 18,62 2,46 2,18" 
             fill="#0b0f14" 
             stroke="url(#kaiFullGrad)" 
             stroke-width="2.5" 
             stroke-linejoin="round"
             filter="url(#jadeGlowFull)"/>

    <!-- Concentric Ring -->
    <circle cx="32" cy="32" r="22" stroke="#00ff88" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="32" cy="32" r="17" fill="#00ff88" fill-opacity="0.1"/>

    <!-- Crossed Katanas -->
    <path d="M12 10 Q 24 22 36 34 L 43 41" stroke="url(#bladeGradFull)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="40" y1="44" x2="46" y2="38" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="43" y1="41" x2="52" y2="50" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>

    <path d="M52 10 Q 40 22 28 34 L 21 41" stroke="url(#bladeGradFull)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="24" y1="44" x2="18" y2="38" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="21" y1="41" x2="12" y2="50" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>

    <!-- Martial Arts Fighter -->
    <circle cx="28" cy="24" r="3" fill="#00ff88"/>
    <path d="M28 27 L 31 36 L 27 38 L 24 30 Z" fill="#ffffff"/>
    <path d="M31 35 L 42 27 L 46 25 L 45 28 L 38 34 Z" fill="#00ff88"/>
    <path d="M27 38 L 29 45 L 24 47 L 23 44 Z" fill="#cbe6f6"/>
    <path d="M26 29 L 20 28 L 22 26 Z" fill="#ffffff"/>
    <path d="M29 30 L 35 31 L 34 33 Z" fill="#00ff88"/>
    <path d="M16 18 Q 32 12 48 20" stroke="#00ff88" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>

  <!-- 2. Typography Group (Right) -->
  <g transform="translate(62, 0)">
    <!-- Brand Name "KAI" -->
    <text x="0" y="34" font-family="'Syne', 'Space Grotesk', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1">KAI</text>
    
    <!-- Decorative Combat Slash -->
    <line x1="56" y1="18" x2="68" y2="34" stroke="url(#kaiFullGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Kanji Sub-badge for Authenticity (武 = Martial / Budo) -->
    <rect x="76" y="14" width="22" height="22" rx="3" fill="rgba(0, 255, 136, 0.12)" stroke="#00ff88" stroke-width="1"/>
    <text x="87" y="30" font-family="sans-serif" font-weight="bold" font-size="13" fill="#00ff88" text-anchor="middle">武</text>

    <!-- Subtitle "MARTIAL ARTS ACADEMY" -->
    <text x="0" y="48" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="8.5" fill="#00ff88" letter-spacing="3.2">MARTIAL ARTS ACADEMY</text>
  </g>
</svg>
