<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Cyber Jade to Cyan Gradient -->
    <linearGradient id="kaiLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    
    <!-- Steel Blade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbe6f6"/>
      <stop offset="100%" stop-color="#70a6c7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="jadeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00ff88" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Combat Octagonal Shield Base -->
  <polygon points="18,2 46,2 62,18 62,46 46,62 18,62 2,46 2,18" 
           fill="#0b0f14" 
           stroke="url(#kaiLogoGrad)" 
           stroke-width="2.5" 
           stroke-linejoin="round"
           filter="url(#jadeGlow)"/>

  <!-- 2. Inner Concentric Combat Ring (Japanese Martial Mon) -->
  <circle cx="32" cy="32" r="23" stroke="#00ff88" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="19" fill="#00ff88" fill-opacity="0.08"/>

  <!-- 3. Crossed Katana Swords -->
  <!-- Katana 1: Top-Left to Bottom-Right -->
  <!-- Blade -->
  <path d="M12 10 Q 24 22 36 34 L 43 41" stroke="url(#bladeGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Blade Edge Highlight -->
  <path d="M11 9 Q 23 21 35 33" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Tsuba (Guard) -->
  <line x1="40" y1="44" x2="46" y2="38" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tsuka (Hilt) -->
  <line x1="43" y1="41" x2="52" y2="50" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="52.5" cy="50.5" r="1.5" fill="#ffffff"/>

  <!-- Katana 2: Top-Right to Bottom-Left -->
  <!-- Blade -->
  <path d="M52 10 Q 40 22 28 34 L 21 41" stroke="url(#bladeGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Blade Edge Highlight -->
  <path d="M53 9 Q 41 21 29 33" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Tsuba (Guard) -->
  <line x1="24" y1="44" x2="18" y2="38" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tsuka (Hilt) -->
  <line x1="21" y1="41" x2="12" y2="50" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="11.5" cy="50.5" r="1.5" fill="#ffffff"/>

  <!-- 4. Central Martial Arts Fighter Silhouette (High Yoko-Geri / Flying Side Kick) -->
  <!-- Head -->
  <circle cx="28" cy="24" r="3" fill="#00ff88"/>
  <!-- Torso & Gi Uniform -->
  <path d="M28 27 L 31 36 L 27 38 L 24 30 Z" fill="#ffffff"/>
  <!-- Extended Kicking Leg (Side Kick) -->
  <path d="M31 35 L 42 27 L 46 25 L 45 28 L 38 34 Z" fill="#00ff88"/>
  <!-- Foot Strike Tip -->
  <polygon points="46,24 49,25 45,28" fill="#ffffff"/>
  <!-- Supporting Grounded / Bent Leg -->
  <path d="M27 38 L 29 45 L 24 47 L 23 44 Z" fill="#cbe6f6"/>
  <!-- Guard Arms (Defensive Hand & Punch) -->
  <path d="M26 29 L 20 28 L 22 26 Z" fill="#ffffff"/>
  <path d="M29 30 L 35 31 L 34 33 Z" fill="#00ff88"/>

  <!-- 5. Energy Slash Arc (Katana Sweep) -->
  <path d="M16 18 Q 32 12 48 20" stroke="#00ff88" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
